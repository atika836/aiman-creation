<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Checkout - Aiman Creation</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#28a745;
color:white;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#218838;
}
</style>

</head>

<body>

<div class="box">

<h2 align="center">Checkout</h2>

<input type="text" placeholder="Full Name">

<input type="tel" placeholder="Mobile Number">

<textarea placeholder="Full Address"></textarea>

<input type="text" placeholder="PIN Code">

<button onclick="placeOrder()">Place Order</button>

</div>

<script>
function placeOrder(){

let phone="7205634090"; 

let message="Hello Aiman Creation,%0A%0AI want to order a product.";

window.open("https://wa.me/"+phone+"?text="+message);

localStorage.removeItem("cart");


localStorage.removeItem("cart");
window.location.href="index.html";
}
</script>

</body>
</html>
